#Jede Anfrage wird an index.php weitergeleitet
# (FallbackResource greift nicht bei nicht existierenden .php-Dateien wie /wp-login.php, daher mod_rewrite)
<Directory /var/www/html>
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /index.php [L]
</Directory>

#Angreifer IP aus dem Header von Caddy übernehmen
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12

#Apache Version verschleiern
ServerTokens Prod
ServerSignature Off


