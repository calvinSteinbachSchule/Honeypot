<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, noarchive">
    <title>Log In &lsaquo; My WordPress Website &#8212; WordPress</title>
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body class="login wp-core-ui">
    <div id="login">
        <h1 class="logo"><a href="https://wordpress.org/">W</a></h1>
        {{FEHLER}}
        <form name="loginform" id="loginform" action="/wp-login.php" method="post">
            <label for="user_login">Username or Email Address</label>
            <input type="text" name="log" id="user_login" value="{{BENUTZERNAME}}" autocomplete="username" required>

            <label for="user_pass">Password</label>
            <input type="password" name="pwd" id="user_pass" autocomplete="current-password" required>

            <p class="forgetmenot">
                <input name="rememberme" type="checkbox" id="rememberme" value="forever">
                <label for="rememberme">Remember Me</label>
            </p>

            <input type="submit" name="wp-submit" id="wp-submit" value="Log In">
            <input type="hidden" name="redirect_to" value="/wp-admin/">
            <input type="hidden" name="testcookie" value="1">
        </form>

        <p id="nav"><a href="/wp-login.php?action=lostpassword">Lost your password?</a></p>
        <p id="backtoblog"><a href="/">&larr; Go to My WordPress Website</a></p>
    </div>
</body>
</html>
