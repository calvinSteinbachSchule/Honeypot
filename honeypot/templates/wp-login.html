<!DOCTYPE html>
	<html lang="en-US">
	<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Log In &lsaquo; My WordPress Website &#8212; WordPress</title>
	<meta name='robots' content='max-image-preview:large, noindex, noarchive' />
<link rel='stylesheet' href='/wp-includes/css/dashicons.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-includes/css/buttons.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-admin/css/forms.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-admin/css/l10n.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-includes/css/dist/base-styles/admin-schemes.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-admin/css/wp-tooltip.min.css?ver=7.1.3' media='all' />
<link rel='stylesheet' href='/wp-admin/css/login.min.css?ver=7.1.3' media='all' />
	<meta name='referrer' content='strict-origin-when-cross-origin' />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		</head>
	<body class="login no-js login-action-login wp-core-ui admin-color-modern locale-en-us">

				<h1 class="screen-reader-text">Log In</h1>
			<div id="login">
		<h1 role="presentation" class="wp-login-logo"><a href="https://wordpress.org/">Powered by WordPress</a></h1>
{{FEHLER}}	
		<form name="loginform" id="loginform" action="/wp-login.php" method="post">
			<p>
				<label for="user_login">Username or Email Address</label>
				<input type="text" name="log" id="user_login" class="input ltr" value="{{BENUTZERNAME}}" size="20" autocapitalize="off" autocomplete="username" required="required" />
			</p>

			<div class="user-pass-wrap">
				<label for="user_pass">Password</label>
				<div class="wp-pwd">
					<input type="password" name="pwd" id="user_pass" class="input password-input ltr" value="" size="20" autocomplete="current-password" spellcheck="false" required="required" />
					<button type="button" class="button button-secondary wp-hide-pw hide-if-no-js" data-toggle="0" aria-label="Show password">
						<span class="dashicons dashicons-visibility" aria-hidden="true"></span>
					</button>
				</div>
			</div>
									<p class="forgetmenot">
				<input name="rememberme" type="checkbox" id="rememberme" value="forever"  />
				<label for="rememberme">Remember Me</label>
				<span class="wp-tooltip wp-is-toggletip">
				<button aria-haspopup="dialog" aria-label="Help" class="wp-tooltip__toggle" popovertarget="rememberme-help-toggletip" type="button"><span aria-hidden="true" class="dashicons dashicons-editor-help"></span></button>
				<span popover="auto" id="rememberme-help-toggletip" class="wp-tooltip__bubble" role="dialog" aria-label="Help" tabindex="-1" autofocus><span id="rememberme-help-toggletip-text" class="wp-tooltip__text">Selecting &quot;Remember Me&quot; increases the length of time until you&#8217;re asked to log in again on this device. To keep your account secure, use this option only on your personal devices.</span><button type="button" class="wp-tooltip__close" popovertarget="rememberme-help-toggletip" popovertargetaction="hide" aria-label="Close"><span class="dashicons dashicons-no-alt" aria-hidden="true"></span></button></span></span>			</p>
			<p class="submit">
				<input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
									<input type="hidden" name="redirect_to" value="/wp-admin/" />
									<input type="hidden" name="testcookie" value="1" />
			</p>
		</form>

					<p id="nav">
				<a class="wp-login-lost-password" href="/wp-login.php?action=lostpassword">Lost your password?</a>			</p>
		<p id="backtoblog">
			<a href="/">&larr; Go to My WordPress Website</a>		</p>
			</div>
		
	</body>
	</html>
